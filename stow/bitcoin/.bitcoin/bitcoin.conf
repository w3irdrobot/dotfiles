# Uses ~/.bitcoin by default. Before starting, choose storage manually and add
# an absolute datadir path below if needed. No directory, group, or service is
# provisioned by the dotfiles installer.
# datadir=/absolute/path/to/bitcoin
txindex=1

# Tor-only networking
onlynet=onion
proxy=127.0.0.1:9050

# Listen only on localhost
bind=127.0.0.1
bind=::1
listen=1

# Optional hardening (prevents any clearnet discovery attempts)
dnsseed=0
discover=0

# rpc
rpcbind=127.0.0.1
