name: Deploy Install Script to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'install.sh'
      - '.github/workflows/deploy-install-script.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare docs directory
        id: artifact
        run: |
          bash -n install.sh
          shellcheck install.sh
          staging="$(mktemp -d "$RUNNER_TEMP/dotfiles-pages.XXXXXXXX")"
          cp install.sh "$staging/install.sh"
          printf 'path=%s\n' "$staging" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.artifact.outputs.path }}

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
