name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install lint tools (CI runner only)
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck stow jq
      - name: Bash syntax and ShellCheck
        run: python3 scripts/check-shell.py
      - name: Fixture-only safety tests with real GNU Stow
        run: python3 -B -m unittest discover -s tests -v
      - name: Package metadata syntax (offline)
        run: python3 scripts/check-packages.py

  fedora-stow:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real Stow tests in disposable Fedora ${{ matrix.fedora }} container
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --workdir /src registry.fedoraproject.org/fedora:${{ matrix.fedora }} \
            bash -c 'dnf install --assumeyes python3 stow git diffutils findutils util-linux shadow-utils jq && useradd --create-home tester && runuser -u tester -- python3 -B -m unittest discover -s tests -v'

  package-existence:
    # Explicit network validation only on trusted master pushes, not PR code.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: [44, 45]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Query Fedora ${{ matrix.fedora }} and selected RPM metadata (no application installation)
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --workdir /src registry.fedoraproject.org/fedora:${{ matrix.fedora }} \
            bash -c 'dnf install --assumeyes python3 && cp repos/*.repo /etc/yum.repos.d/ && dnf --assumeyes --refresh makecache && python3 scripts/check-packages.py --network'
