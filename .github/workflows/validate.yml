name: Validate

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install lint tools (CI runner only)
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt stow
      - name: Bash syntax, ShellCheck, and shfmt
        run: python3 scripts/check-shell.py
      - name: Fixture-only safety tests with real GNU Stow
        run: python3 -m unittest discover -s tests -v
      - name: Package metadata syntax (offline)
        run: python3 scripts/check-packages.py

  arch-stow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real Stow tests in disposable Arch container
        run: |
          docker run --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/src,readonly" \
            --workdir /src archlinux:base \
            bash -c 'pacman -Syu --noconfirm --needed python stow git && useradd --create-home tester && runuser -u tester -- python -m unittest discover -s tests -v'

  package-existence:
    # Explicit network validation only on trusted master pushes, not PR code.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Query Arch and AUR metadata (no package installation)
        run: python3 scripts/check-packages.py --network
